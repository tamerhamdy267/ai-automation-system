<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Customer Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .response-section {
            margin-top: 30px;
        }

        .response-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AI Customer Support</h1>

        <p class="subtitle">
            Ask us anything and our AI support assistant will help you.
        </p>

        <textarea
            id="message"
            placeholder="Type your message here..."
        ></textarea>

        <button id="sendButton" onclick="sendMessage()">
            Send Message
        </button>

        <div class="response-section">

            <h2>Assistant Response</h2>

            <div id="response" class="response-box">
                Waiting for your message...
            </div>

            <div id="status" class="status"></div>

        </div>

    </div>

    <div class="footer">
        AI Customer Support System
    </div>

</div>

<script>

const CUSTOMER_ID_KEY = "ai_support_customer_id";

function getCustomerId() {

    let customerId = localStorage.getItem(CUSTOMER_ID_KEY);

    if (!customerId) {

        const randomPart = crypto.randomUUID()
            .replace(/-/g, "")
            .substring(0, 12)
            .toUpperCase();

        customerId = "WEB-" + randomPart;

        localStorage.setItem(
            CUSTOMER_ID_KEY,
            customerId
        );
    }

    return customerId;
}


async function sendMessage() {

    const messageBox = document.getElementById("message");
    const responseBox = document.getElementById("response");
    const statusBox = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");

    const message = messageBox.value.trim();

    if (!message) {
        responseBox.innerText = "Please enter a message.";
        return;
    }

    responseBox.innerText = "Processing...";
    statusBox.innerText = "AI is processing your request...";
    sendButton.disabled = true;
    sendButton.innerText = "Processing...";

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                customer_id: getCustomerId()
            })

        });

        const data = await response.json();

        if (!response.ok) {

            responseBox.innerText =
                "Server error: " + JSON.stringify(data);

            statusBox.innerText = "";

            return;
        }

        responseBox.innerText =
            data.response || "No response received.";

        statusBox.innerText =
            data.needs_human
                ? "Your request has been forwarded for human review."
                : "Handled by AI support.";

    } catch (error) {

        console.error(error);

        responseBox.innerText =
            "Connection error. Please try again.";

        statusBox.innerText = "";

    } finally {

        sendButton.disabled = false;
        sendButton.innerText = "Send Message";

    }
}

</script>

</body>
</html>
